# Once a day, GitHub checks that every camera in cams.js still works
# (scripts/check_cameras.py). If one has stopped, it opens an issue in this
# repository, and GitHub emails us about it. While that issue is open, later
# runs add a comment instead of opening a new one.
#
# It also looks for a working camera nearby (scripts/fix_cameras.py) and
# suggests it in a pull request. Nothing changes on the site until someone
# checks the suggestion and presses Merge.
#
# Run it by hand: GitHub → Actions → "Check cameras" → "Run workflow"
# (or `gh workflow run check-cameras.yml`).

name: Check cameras

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC (08:00–09:00 in Finland)
  workflow_dispatch:
    inputs:
      include_replaced:
        description: "Also check retired cameras (a test: the old Jersey City stream always fails)"
        type: boolean
        default: false

permissions:
  contents: write # to push the suggested fix to its own branch
  pull-requests: write # to open the pull request
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every camera
        id: check
        continue-on-error: true
        env:
          # Saved under Settings → Secrets and variables → Actions. GitHub hides
          # it in logs, and it never appears in the code.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/check_cameras.py ${{ inputs.include_replaced && '--include-replaced' || '' }}

      - name: Suggest a replacement in a pull request
        if: steps.check.outcome == 'failure' && hashFiles('camera-stopped.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/fix_cameras.py
          [ -f fix-branch.txt ] || exit 0
          branch=$(cat fix-branch.txt)
          # Already suggested on an earlier day? Then point to that pull request.
          existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          if [ -n "$existing" ]; then
            printf '\nA suggested fix is waiting in %s\n' "$existing" >> camera-report.md
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add cams.js index.html
          git commit -m "Replace stopped camera: ${branch#fix-camera/}"
          git push --force origin "$branch"
          if pr=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
                  --title "Replace stopped camera: ${branch#fix-camera/}" --body-file fix-pr.md); then
            printf '\nA suggested fix is waiting in %s\n' "$pr" >> camera-report.md
          else
            # GitHub didn't let the workflow open it; one tap on this link does
            link="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...$branch?expand=1"
            printf '\nA suggested fix is ready: open %s and press "Create pull request".\n' "$link" >> camera-report.md
          fi

      - name: Tell us in an issue
        if: steps.check.outcome == 'failure' && hashFiles('camera-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dead-camera --color B60205 --description "A camera has stopped working" 2>/dev/null || true
          open_issue=$(gh issue list --label dead-camera --state open --json number --jq '.[0].number')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body-file camera-report.md
          else
            gh issue create --title "A camera has stopped working" --label dead-camera --body-file camera-report.md
          fi
